name: Update product feed

on:
  schedule:
    # Toutes les 6 heures (heure UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: {}   # permet de le lancer manuellement depuis l'onglet "Actions"

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Firebase
        run: npm install firebase

      - name: Générer le feed
        run: node generate-feed.js

      - name: Committer et pousser si le feed a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --quiet --cached || git commit -m "Mise à jour automatique du feed produits"
          git push
