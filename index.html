function useProducts(){
  const [products, setProducts] = useState([]);
  const [loaded, setLoaded] = useState(false);

  const loadLocal = useCallback(async () => {
    try {
      const res = await window.storage.get(STORAGE_KEY, true);
      const list = res && res.value ? JSON.parse(res.value) : [];
      setProducts(list);
    } catch (e) {
      setProducts([]);
    }
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (FIREBASE_READY) {
      const unsub = getDb().collection('products').onSnapshot((snap) => {
        const list = snap.docs.map(d => d.data());
        list.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
        setProducts(list);
        setLoaded(true);
      }, (err) => { console.error('firestore error', err); setLoaded(true); });
      return () => unsub();
    } else {
      loadLocal();
    }
  }, [loadLocal]);

  const persistLocal = async (list) => {
    setProducts(list);
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(list), true); }
    catch(e) { console.error('storage error', e); }
  };

  const addProduct = async (p) => {
    const product = {...p, id: uid(), createdAt: Date.now()};
    if (FIREBASE_READY) {
      try { await getDb().collection('products').doc(product.id).set(product); }
      catch(e) { console.error('firestore add error', e); }
    } else {
      persistLocal([product, ...products]);
    }
  };
  const updateProduct = async (id, patch) => {
    if (FIREBASE_READY) {
      try { await getDb().collection('products').doc(id).update(patch); }
      catch(e) { console.error('firestore update error', e); }
    } else {
      persistLocal(products.map(p => p.id === id ? {...p, ...patch} : p));
    }
  };
  const deleteProduct = async (id) => {
    if (FIREBASE_READY) {
      try { await getDb().collection('products').doc(id).delete(); }
      catch(e) { console.error('firestore delete error', e); }
    } else {
      persistLocal(products.filter(p => p.id !== id));
    }
  };

  return { products, loaded, addProduct, updateProduct, deleteProduct };
}

function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

function ImageCropper({ src, crop, onChange }){
  const frameRef = useRef(null);
  const dragState = useRef(null);
  const pointers = useRef(new Map());
  const pinchState = useRef(null);
  const [active, setActive] = useState(false);
  const c = crop || { x:0.5, y:0.5, zoom:1 };

  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  const onPointerDown = (e) => {
    e.preventDefault();
    const frame = frameRef.current;
    try { frame.setPointerCapture(e.pointerId); } catch(err){}
    pointers.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    setActive(true);

    if (pointers.current.size === 2) {
      const pts = Array.from(pointers.current.values());
      pinchState.current = { startDist: dist(pts[0], pts[1]), startZoom: c.zoom };
      dragState.current = null;
    } else if (pointers.current.size === 1) {
      dragState.current = { startX: e.clientX, startY: e.clientY, cx: c.x, cy: c.y, w: frame.clientWidth, h: frame.clientHeight };
      pinchState.current = null;
    }
  };
  const onPointerMove = (e) => {
    if (!pointers.current.has(e.pointerId)) return;
    pointers.current.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.current.size === 2 && pinchState.current) {
      const pts = Array.from(pointers.current.values());
      const newDist = dist(pts[0], pts[1]);
      const ratio = newDist / (pinchState.current.startDist || 1);
      const newZoom = clamp(pinchState.current.startZoom * ratio, 1, 3);
      onChange({ ...c, zoom: newZoom });
    } else if (dragState.current) {
      const { startX, startY, cx, cy, w, h } = dragState.current;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      const nx = clamp(cx - dx / (w * c.zoom), 0, 1);
      const ny = clamp(cy - dy / (h * c.zoom), 0, 1);
      onChange({ ...c, x: nx, y: ny });
    }
  };
  const endPointer = (e) => {
    pointers.current.delete(e.pointerId);
    try { frameRef.current.releasePointerCapture(e.pointerId); } catch(err){}
    if (pointers.current.size === 0) {
      dragState.current = null; pinchState.current = null; setActive(false);
    } else if (pointers.current.size === 1) {
      const [[id, p]] = Array.from(pointers.current.entries());
      dragState.current = { startX: p.x, startY: p.y, cx: c.x, cy: c.y, w: frameRef.current.clientWidth, h: frameRef.current.clientHeight };
      pinchState.current = null;
    }
  };
  const onWheel = (e) => {
    e.preventDefault();
    const newZoom = clamp(c.zoom - e.deltaY * 0.0015, 1, 3);
    onChange({ ...c, zoom: newZoom });
  };

  return React.createElement('div', {className:'cropper'},
    React.createElement('div', {
      className:'crop-frame', ref: frameRef,
      onPointerDown, onPointerMove, onPointerUp: endPointer, onPointerCancel: endPointer, onWheel

function AdminForm({ onSave, editing, onCancelEdit }){
  const blank = { name:'', category: CATEGORIES[0], price:'', desc:'', images: [''], fit: 'cover', crop: { x:0.5, y:0.5, zoom:1 } };
  const [form, setForm] = useState(blank);
  const [msg, setMsg] = useState('');

  useEffect(() => {
    if (editing) {
      const imgs = getImages(editing);
      setForm({
        name: editing.name, category: editing.category, price: editing.price, desc: editing.desc || '',
        images: imgs.length ? imgs : [''], fit: editing.fit === 'contain' ? 'contain' : 'cover',
        crop: editing.crop || { x:0.5, y:0.5, zoom:1 }
      });
    } else setForm(blank);
  }, [editing]);

  const set = (k) => (e) => setForm(f => ({...f, [k]: e.target.value}));

  const setImageAt = (i) => (e) => {
    const val = e.target.value;
    setForm(f => {
      const images = [...f.images];
      images[i] = val;
      const crop = i === 0 ? { x:0.5, y:0.5, zoom:1 } : f.crop;
      return {...f, images, crop};
    });
  };
  const addImageField = () => setForm(f => ({...f, images: [...f.images, '']}));
  const removeImageField = (i) => setForm(f => {
    const images = f.images.filter((_, idx) => idx !== i);
    return {...f, images: images.length ? images : ['']};
  });

  const submit = (e) => {
    e.preventDefault();
    if (!form.name.trim()) { setMsg("Le nom de l'article est obligatoire."); return; }
    const images = form.images.map(s => s.trim()).filter(Boolean);
    onSave({ name: form.name, category: form.category, price: form.price, desc: form.desc, images, fit: form.fit, crop: form.crop });
    setMsg(editing ? 'Article mis à jour.' : 'Article ajouté au catalogue.');
    setForm(blank);
    setTimeout(() => setMsg(''), 2500);
  };

  return React.createElement('form', {className:'admin-form', onSubmit: submit},
    React.createElement('div', {className:'field'},
      React.createElement('label', null, "Nom de l'article"),
      React.createElement('input', {value: form.name, onChange: set('name'), placeholder: 'Ex: Armoire chêne 3 portes', required: true})
    ),
    React.createElement('div', {className:'field'},
      React.createElement('label', null, 'Catégorie'),
      React.createElement('select', {value: form.category, onChange: set('category')},
        CATEGORIES.map(c => React.createElement('option', {key:c, value:c}, c))
      )
    ),
    React.createElement('div', {className:'field'},
      React.createElement('label', null, 'Prix (DT, facultatif)'),
      React.createElement('input', {value: form.price, onChange: set('price'), placeholder: 'Ex: 1450'})
    ),
    React.createElement('div', {className:'field full'},
      React.createElement('label', null, 'Photos (facultatif — la première est la photo principale)'),
      form.images.map((url, i) => React.createElement('div', {className:'img-row', key:i},
        React.createElement('input', {value: url, onChange: setImageAt(i), placeholder: 'https://...'}),
        form.images.length > 1 ? React.createElement('button', {type:'button', onClick: () => removeImageField(i)}, '\u00D7') : null
      )),
      React.createElement('button', {type:'button', className:'add-img-btn', onClick: addImageField}, '+ Ajouter une photo'),
      React.createElement('div', {className:'hint'}, 'Ajoute autant de photos que tu veux. Les visiteurs pourront cliquer sur l\u2019article pour toutes les voir en grand.')
    ),
    React.createElement('div', {className:'field full'},
      React.createElement('label', null, 'Affichage de la photo dans le catalogue'),
      React.createElement('div', {className:'fit-choice'},
        React.createElement('label', {className:'fit-option'},
          React.createElement('input', {type:'radio', name:'fit', value:'cover', checked: form.fit !== 'contain', onChange: () => setForm(f => ({...f, fit:'cover'}))}),
          React.createElement('span', null, 'Remplir la vignette (peut légèrement recadrer)')
        ),
        React.createElement('label', {className:'fit-option'},
          React.createElement('input', {type:'radio', name:'fit', value:'contain', checked: form.fit === 'contain', onChange: () => setForm(f => ({...f, fit:'contain'}))}),
          React.createElement('span', null, 'Montrer la photo entière (sans recadrage)')
        )
      ),
      React.createElement('div', {className:'hint'}, 'Choisis "photo entière" si le recadrage coupe des éléments importants (ex: plusieurs meubles côte à côte, un tableau complet).')
    ),
    (form.fit !== 'contain' && form.images[0] && form.images[0].trim()) ? React.createElement('div', {className:'field full'},
      React.createElement('label', null, 'Cadrer la photo principale (miniature du catalogue)'),
      React.createElement(ImageCropper, {
        src: form.images[0],
        crop: form.crop,
        onChange: (crop) => setForm(f => ({...f, crop}))
      })
    ) : null,
    React.createElement('div', {className:'field full'},
      React.createElement('label', null, 'Description courte'),
      React.createElement('textarea', {value: form.desc, onChange: set('desc'), placeholder: 'Matériaux, finition, couleur...'})
    ),
    React.createElement('div', {className:'full actions'},
      React.createElement('button', {className:'btn', type:'submit'}, editing ? 'Enregistrer les modifications' : 'Ajouter au catalogue'),
      editing ? React.createElement('button', {className:'btn btn-ghost', type:'button', onClick: onCancelEdit}, 'Annuler') : null,
      msg ? React.createElement('span', {className:'status-msg'}, msg) : null
    )
  );
}

function AdminPanel({ products, addProduct, updateProduct, deleteProduct, onExit }){

  return React.createElement(React.Fragment, null,
